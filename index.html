<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAVÈRA - Where Culture Lives Forever</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<body>

  <!-- Floating Capsule Navbar -->
  <nav class="navbar-wrapper">
    <div class="navbar-capsule">
      <a href="index.html" class="nav-item active">Home</a>
      <a href="explore.html" class="nav-item">Explore</a>
      <a href="collection.html" class="nav-item">Collection</a>

      <a href="quiz.html" class="nav-item">Cultural Quiz</a>
    </div>
  </nav>

  <!-- 1. Hero Section --> 
  <main class="hero-section" id="home">
    <!-- 4 Split Columns Background Video (Durasi 60 detik per loop) -->
    <div class="video-grid">
      <!-- Kolom 1: Jawa Timur (detik 20 - 80) -->
      <div class="video-item">
        <video autoplay muted loop playsinline class="hero-video">
          <source src="assets/videos/jatim.mp4#t=20,80" type="video/mp4" />
        </video>
      </div>

      <!-- Kolom 2: D.I. Yogyakarta (detik 22 - 82) -->
      <div class="video-item">
        <video autoplay muted loop playsinline class="hero-video">
          <source src="assets/videos/jogja.mp4#t=22,82" type="video/mp4" />
        </video>
      </div>

      <!-- Kolom 3: Jawa Barat (detik 16 - 76) -->
      <div class="video-item">
        <video autoplay muted loop playsinline class="hero-video">
          <source src="assets/videos/jabar.mp4#t=16,76" type="video/mp4" />
        </video>
      </div>

      <!-- Kolom 4: Keraton Yogyakarta / Jawa Tengah (detik 12 - 72) -->
      <div class="video-item">
        <video autoplay muted loop playsinline class="hero-video">
          <source src="assets/videos/keraton.mp4#t=12,72" type="video/mp4" />
        </video>
      </div>
    </div>

    <!-- Overlay Gelap Tipis & Efek Vignette -->
    <div class="hero-overlay"></div>

    <!-- Konten Teks Tengah -->
    <div class="hero-content">
      <span class="sub-tagline">A Digital Museum of Java Island</span>
      <h1 class="main-title">Where Culture Lives Forever</h1>
      <p class="tagline">Preserving Stories Through Art</p>
    </div>
  </main>

  <script type="module" src="js/main.js"></script>
